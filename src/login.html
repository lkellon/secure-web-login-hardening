<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; form-action 'self'; object-src 'none'; base-uri 'self';"
    >

    <title>Secure Login Demo</title>
</head>

<body>

    <main>
        <h1>Secure Login</h1>

        <form
            method="post"
            action="user_credential_check.php"
            autocomplete="on"
        >

            <label for="userId">User ID:</label>

            <input
                type="text"
                id="userId"
                name="userId"
                maxlength="50"
                autocomplete="username"
                required
            >

            <label for="password">Password:</label>

            <input
                type="password"
                id="password"
                name="password"
                maxlength="128"
                autocomplete="current-password"
                required
            >

            <button type="submit">Log In</button>

        </form>
    </main>

</body>

</html>
